<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#714b67">
  <meta name="description" content="MyERP, gestionale personale offline">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>MyERP</title>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">M</span><span>MyERP</span></div>
    <div class="topbar-right"><span id="connection" class="status">Avvio…</span><span class="user-chip">Utente locale</span></div>
  </header>
  <main class="shell">
    <aside class="sidebar" aria-label="Applicazioni">
      <div class="side-caption">APPLICAZIONI</div>
      <button class="nav-item active" data-view="dashboard"><span class="nav-icon">⌂</span><span>Panoramica</span></button>
      <button class="nav-item" data-view="crm"><span class="nav-icon">◉</span><span>CRM</span></button>
      <button class="nav-item" data-view="contacts"><span class="nav-icon">♙</span><span>Contatti</span></button>
      <button class="nav-item" data-view="sales"><span class="nav-icon">▤</span><span>Vendite</span></button>
      <button class="nav-item" data-view="purchases"><span class="nav-icon">⇩</span><span>Acquisti</span></button>
      <button class="nav-item" data-view="inventory"><span class="nav-icon">▦</span><span>Magazzino</span></button>
      <button class="nav-item" data-view="invoices"><span class="nav-icon">€</span><span>Fatturazione</span></button>
      <button class="nav-item" data-view="activities"><span class="nav-icon">◷</span><span>Attività</span></button>
      <button class="nav-item" data-view="documents"><span class="nav-icon">▧</span><span>Documenti</span></button>
      <button class="nav-item" data-view="cashbook"><span class="nav-icon">€</span><span>Prima nota</span></button>
      <button class="nav-item" data-view="reports"><span class="nav-icon">▥</span><span>Report</span></button>
      <div class="side-caption side-caption-bottom">DATI</div>
      <button class="nav-item" data-view="backup"><span class="nav-icon">↕</span><span>Backup e ripristino</span></button>
    </aside>
    <section class="content">
      <div class="page-heading">
        <div><p class="eyebrow">AREA DI LAVORO</p><h1 id="page-title">Panoramica</h1></div>
        <span class="local-tag"><span class="local-dot"></span> Archivio su questo dispositivo</span>
      </div>
      <div id="view" aria-live="polite"></div>
    </section>
  </main>
  <footer>MyERP · Gestionale personale · I dati restano su questo dispositivo</footer>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
